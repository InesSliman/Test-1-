<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Inès Sliman</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .card {
      width: min(560px, 90vw);
      background: #ffffff;
      border: 1px solid #e7e3de;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(17, 17, 17, 0.06);
      padding: 2rem;
    }

    .eyebrow {
      display: inline-block;
      background: #eef3ff;
      color: #1a56db;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.4rem);
      margin: 0 0 0.75rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 1.25rem;
      color: #4e4e4d;
      line-height: 1.6;
    }

    .list {
      display: grid;
      gap: 14px;
      margin-top: 1.25rem;
    }

    .item {
      padding: 14px 16px;
      border: 1px solid #ece8e5;
      border-radius: 12px;
      background: #fafaf9;
    }

    .label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: #696865;
      margin-bottom: 6px;
    }

    a {
      color: #1a56db;
      text-decoration: none;
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid #111111;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: #111111;
      color: white;
    }

    .btn-secondary {
      color: #111111;
      background: white;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Contact</div>
    <h1>Contact Inès</h1>
    <p>Feel free to reach out for opportunities, collaborations, or a quick conversation.</p>

    <div class="list">
      <div class="item">
        <span class="label">Phone</span>
        <a href="tel:+33787050311">+33 787 050 311</a>
      </div>

      <div class="item">
        <span class="label">Email</span>
        <a href="mailto:ines.slimankaddour@sciencespo.fr">ines.slimankaddour@sciencespo.fr</a>
      </div>

      <div class="item">
        <span class="label">LinkedIn</span>
        <a href="https://www.linkedin.com/in/ines-sliman-944160202" target="_blank" rel="noreferrer">linkedin.com/in/ines-sliman-944160202</a>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="mailto:ines.slimankaddour@sciencespo.fr">Email Inès</a>
      <a class="btn btn-secondary" href="index.html">Back to quiz</a>
    </div>
  </main>
</body>
</html>
